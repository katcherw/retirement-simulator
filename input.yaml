# This is the template for an input file. Currency fields and interest rates
# may be entered with or without a decimal (3740.00 or 3740). Ages must be
# integers without decimal points. All currency is in today's dollars
# (simulation results are all in today's dollars).

# The retiree block must have either one or two retirees. Withdrawals for
# expenses begin when the first of them retires; a retiree who is still
# working brings in their salary (minus contributions) until they retire.

retirees:
     - name: John Doe
       date_of_birth: 9/30/1960                 # mm/dd/yyyy
       retirement_age: 67                       # age to stop collecting wages 
       life_expectancy: 90                      # Age that you expect to live to 
       wage_annual_salary: 75000.0              # annual salary before retirement (before taxes) 
       retirement_contribution_percent: 12.0    # percentage of salary going to retirement savings
       social_security_age: 67                  # When you expect to start taking social security
       pension_age: 62                          # age when pension income begins
       pension_monthly_income: 1000.0           # monthly income in today's dollars
       other_monthly_retirement_income: 500.0   # retirement income from all other sources

       # The next values should come from the social security web site to
       # determine how much social security you will earn. Non-working
       # spouse will earn half of the working spouse.
       social_security_amount_early: 2693.0     # amount if you elect SS at 62
       social_security_amount_full: 3870.0      # amount if you elect SS at 67
       social_security_amount_delayed: 4809.0   # amount if you elect SS at 70 

     - name: Jane Doe
       date_of_birth: 4/16/1964                 # mm/dd/yyyy
       retirement_age: 67                       # age to stop collecting wages 
       life_expectancy: 90                      # Age that you expect to live to 
       wage_annual_salary: 87000.0              # annual salary before retirement (before taxes) 
       retirement_contribution_percent: 12.0    # percentage of salary going to retirement savings
       social_security_age: 67                  # When you expect to start taking social security
       pension_age: 0                           # age when pension income begins
       pension_monthly_income: 0.0              # monthly income in today's dollars
       other_monthly_retirement_income: 0.0     # retirement income from all other sources

       # The next values should come from the social security web site to
       # determine how much social security you will earn. Non-working
       # spouse will earn half of the working spouse.
       social_security_amount_early: 2693.0     # amount if you elect SS at 62
       social_security_amount_full: 3870.0      # amount if you elect SS at 67
       social_security_amount_delayed: 4809.0   # amount if you elect SS at 70 

portfolio:
    # balances as of today. balance is everything except Roth accounts:
    # 401(k), 403(b), traditional IRA, and brokerage accounts. Withdrawals
    # are taxed as ordinary income (which overstates the tax on brokerage
    # accounts). roth_balance is Roth IRA, Roth 401(k), and HSA accounts;
    # withdrawals aren't taxed. roth_balance is optional (default 0.0).
    # Withdrawals come from balance first, then from roth_balance.
    balance: 900000.0
    roth_balance: 300000.0

    # asset allocation before retirement (should add up to 100.0)
    pre_retirement_allocation:
        us_equities: 56.0          # percentage of portfolio in us stocks
        bonds: 20.0                # percentage of portfolio in bonds
        international: 24.0        # percentage of portfolio in international stocks

    # asset allocation after retirement (should add up to 100.0)
    post_retirement_allocation:
        us_equities: 42.0          # percentage of portfolio in us stocks
        bonds: 40.0                # percentage of portfolio in bonds
        international: 18.0        # percentage of portfolio in international stocks
    
    # OPTIONAL: the forecasts block below has the built-in defaults. Leave out
    # the whole block, or any value in it, to use the default.
    forecasts:
        # forecasted returns for each asset class in real dollars. Expected
        # returns are geometric (compound annual) averages. values below are
        # obtained from Fidelity. Used for the uniform and monte carlo
        # simulations.
        us_equity_expected_returns: 3.2
        us_equity_standard_deviation: 15.0
        international_equity_expected_returns: 4.1
        international_equity_standard_deviation: 16.0
        bonds_expected_returns: 2.5
        bonds_standard_deviation: 6.0

        # correlation of annual returns between asset classes (-1.0 to 1.0).
        # Used for monte carlo simulation.
        us_international_correlation: 0.8
        us_bonds_correlation: 0.3
        international_bonds_correlation: 0.3

expenses:
    monthly: 9000.0     # estimated monthly expenses during retirment in today's dollars
    survivor_percent: 100.0   # percentage of expenses remaining after a spouse dies
