[package]
name = "retirement-simulator"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
num-format = "0.4"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
ts-rs = { version = "12.0.1", optional = true, features = ["chrono-impl"] }

[features]
# TypeScript types for the plan, the plan defaults, validation errors and the
# report, for TypeScript programs that use the engine. See src/typescript.rs.
typescript = ["dep:ts-rs"]

# rand needs a random source to compile for the browser. The simulations
# don't use it: they seed their own random numbers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
